// GunGame Progression: ranks and cosmetic unlocks.
//
// Ranks: "xp" is the total XP needed (cumulative), the lowest rank must need 0 XP.
// "color" is "R G B", used for the rank tag in chat.
//
// Curve: xp(rank) = 100 * (rank - 1) ^ 2.1, rounded to 50 / 100 / 500.
// A regular player earns about 300-400 XP per 10 minutes on our server (kills on bots at
// 10 XP + headshots + GunGame levels + 5 XP per minute of play + end of match bonuses), so
// about 2100 XP per hour with 350 XP per 10 minutes:
//   rank 10 (Corporal II)      10100 XP  ~ 4.8 h
//   rank 20 (First Sergeant)   48500 XP  ~ 23 h
//   rank 30 (Captain II)      118000 XP  ~ 56 h
//   rank 40 (Colonel III)     219500 XP  ~ 105 h
//   rank 50 (Legend)          354500 XP  ~ 169 h (150-200 h between 400 and 300 XP per 10 minutes)
// The exponent sets the shape: 2.1 makes the first ranks come every few minutes and the last
// ones every 7 hours or so. Multiply every "xp" value to make the whole curve slower or faster.
//
// Unlocks: every item needs a "rank" (the item is unlocked from that rank on) and a "name"
// (shown in menus, not translated). The section name is the key saved in the database:
// renaming it unequips the item for everyone. "none" and keys with ":" are reserved.
//
// tags:         "text" (shown as [text] before the name in chat), "color" "R G B".
//               Players can also pick the name of any rank they reached, or no tag.
// trails:       "material" (stock CS:S sprite .vmt only, clients download nothing), "color" "R G B",
//               "width" (start width, 1-16, default 6), "end_width" (0-16, default 1),
//               "lifetime" (seconds, 0.1-3, default 1).
// he_colors:    "color" "R G B" of the thrown HE grenade and of its beam.
// kill_effects: "type" sparks, energy, ring, lightning, confetti or glow, "color" "R G B" or "random"
//               (ring, lightning and confetti are colored, sparks, energy and glow are not).

